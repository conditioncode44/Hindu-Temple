<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Black Hills Hindu Temple</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f1e7;
      color: #3f3028;
    }

    nav {
      padding: 18px 20px;
      text-align: center;
      background: #6b1e23;
    }

    nav a {
      margin: 0 14px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    h1 {
      margin: 32px 20px 10px;
      text-align: center;
      color: #6b1e23;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 25px 20px 45px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: 280px;
      max-width: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 600px) {
      .gallery img {
        height: 220px;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
  </nav>

  <h1>Photo Gallery</h1>

  <div class="gallery">
    <img src="temple-altar.jpg" alt="Temple altar">
    <img src="temple-closeup.jpg" alt="Temple close-up">
  </div>
</body>
</html>
